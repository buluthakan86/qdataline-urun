<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reçete ve Spesifikasyon Yönetimi · Qdataline</title>
<meta name="description" content="Qdataline Reçete ve Spesifikasyon Yönetimi; ürün reçetelerinizi, TGK/BRCGS uyumlu spesifikasyonlarınızı ve alerjen matrisinizi tek yerden yönetin.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-100 -100 200 200'%3E%3Ccircle cx='0' cy='0' r='78' fill='none' stroke='%2365A30D' stroke-width='18' stroke-linecap='round' stroke-dasharray='425 65' stroke-dashoffset='-34' transform='rotate(45)'/%3E%3Cpath d='M 30 30 L 58 58 L 84 42' fill='none' stroke='%2365A30D' stroke-width='18' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#65A30D">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
:root{
  color-scheme:dark;

  /* Marka rengi — URS: Lime (platformdaki diğer 10 modülün hiçbirinde
     kullanılmamış — teal/sky/emerald/amber/violet/coral/indigo/periwinkle/
     orange/fuşya hepsi dolu; fuşya BOY ile çakıştığı için 09.09.2026'da
     lime'a değiştirildi). */
  --forest:#0F1408; --forest-2:#BEF264; --forest-3:#4D7C0F;
  --leaf:#65A30D; --leaf-d:#84CC16; --lime:#BEF264; --ink-on-accent:#1A2E05;

  --sand:#0F130A; --card:#181D10; --mint:#232A16; --mint-2:#1F2513;
  --line:#333D1E; --line-2:#262D17;

  --ink:#F1F5E8; --muted:#8FA06E; --accent:#D9C06A;

  --ok:#34D399;   --ok-bg:rgba(16,185,129,.14);
  --warn:#F0A93B; --warn-bg:rgba(240,169,59,.14);
  --crit:#F87171; --crit-bg:rgba(248,113,113,.14);
  --miss:#93A79B; --miss-bg:rgba(147,167,155,.12);
  --na:#7C8A6D;   --na-bg:rgba(124,138,109,.18);

  --blue:#6FABEF;   --blue-bg:rgba(96,165,250,.14);
  --purple:#B9A5F2; --purple-bg:rgba(167,139,250,.15);

  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);
  --bar-track:#222A15; --sb-thumb:#2C3419; --sb-thumb-h:#3D4923;
}
html[data-theme="light"]{
  color-scheme:light;
  --forest:#F3F8E8; --forest-2:#4D7C0F; --forest-3:#ECFCCB;
  --sand:#FAFDF3; --card:#FFFFFF; --mint:#F2F7E4; --mint-2:#F6FAEC;
  --line:#DCE8C0; --line-2:#EAF1D8;
  --ink:#1B2410; --muted:#66783F; --ink-on-accent:#1A2E05;
  --bar-track:#E9F1D4; --sb-thumb:#CFE0A6; --sb-thumb-h:#B9D183;
}
*{box-sizing:border-box}
body{margin:0; background:var(--sand); color:var(--ink); font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif; font-size:14px; line-height:1.45}
h1,h2,h3,h4{font-family:"Space Grotesk","Inter","Segoe UI",system-ui,sans-serif; letter-spacing:.2px; margin:0}
::-webkit-scrollbar{width:11px; height:11px}
::-webkit-scrollbar-track{background:var(--bar-track)}
::-webkit-scrollbar-thumb{background:var(--sb-thumb); border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--sb-thumb-h)}

button,.btn{font-family:inherit; font-size:12.5px; font-weight:600; border-radius:8px; border:1px solid transparent; padding:8px 14px; transition:.12s; cursor:pointer; white-space:nowrap}
.btn-leaf{background:linear-gradient(135deg,#4D7C0F,#BEF264); color:var(--ink-on-accent); font-weight:700}
.btn-leaf:hover{background:linear-gradient(135deg,#65A30D,#D9F99D)}
.btn-line{background:var(--card); color:var(--ink); border-color:var(--line)}
.btn-line:hover{border-color:var(--leaf); color:var(--leaf-d)}
.btn-danger{background:var(--crit-bg); color:var(--crit); border-color:transparent}
input,select,textarea{font-family:inherit; font-size:13px; background:var(--mint-2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--leaf)}
textarea{min-height:clamp(64px, 11vh, 150px); resize:vertical; line-height:1.5}
textarea.ta-lg{min-height:clamp(90px, 16vh, 220px)}
label{font-size:12px; color:var(--muted); font-weight:600; display:block; margin-bottom:4px}

.app{display:flex; min-height:100vh}
aside.side{width:248px; flex-shrink:0; background:var(--card); color:var(--ink); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; border-right:1px solid var(--line); overflow-y:auto; transition:width .18s ease}
.side.collapsed{width:66px}
.brand{padding:15px 15px 12px; border-bottom:1px solid var(--line-2)}
.logo-row{display:flex; align-items:center; gap:11px}
.brand-toggle{cursor:pointer; position:relative}
.logo-mark{width:54px; height:32px; flex-shrink:0}
.logo-txt .n{font-size:16px; font-weight:500; letter-spacing:.5px; color:var(--ink); line-height:1}
.logo-txt .n b{font-weight:700; background:linear-gradient(90deg,#65A30D,#BEF264); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
.logo-txt .s{font-size:9.5px; color:var(--muted); letter-spacing:.4px; margin-top:3px; text-transform:uppercase}
.side.collapsed .logo-txt,.side.collapsed .nav-lbl,.side.collapsed .cnt{display:none}
.snav{padding:8px}
.nav-group-head{width:100%; text-align:left; background:transparent; border:none; color:#7C9B4A; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; padding:12px 10px 6px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-family:inherit}
.nav-group-head .chev{font-size:10px; transition:transform .2s; opacity:.7}
.nav-group.collapsed .nav-group-body{display:none}
.nav-group.collapsed .chev{transform:rotate(-90deg)}
.nav-group-body{display:flex; flex-direction:column; gap:2px}
.side.collapsed .nav-group-head{display:none}
.side.collapsed .nav-group.collapsed .nav-group-body{display:flex}
.nav-item{display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:9px; color:#C7D9A7; font-size:13px; font-weight:600; border:none; background:transparent; width:100%; text-align:left; transition:.13s; margin-bottom:2px; cursor:pointer}
.nav-item .ico{width:19px; height:19px; flex-shrink:0; text-align:center}
.nav-item:hover{background:var(--mint-2)}
.nav-item.on{background:var(--mint); color:var(--ink); box-shadow:inset 3px 0 0 var(--leaf)}
.nav-item .cnt{margin-left:auto; font-size:11px; padding:1px 8px; border-radius:20px; font-weight:800; background:#2E3A18; color:#DCEBB8}

.main{flex:1; min-width:0}
.topbar{background:var(--card); border-bottom:1px solid var(--line); padding:14px 26px; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:40; flex-wrap:wrap}
.topbar h1{font-size:16px; margin:0; font-weight:700}
.topbar .sp{flex:1}
.content{padding:24px 26px; max-width:1580px; width:100%}
.hamburger{display:none; background:transparent; border:none; color:var(--ink); font-size:20px; line-height:1; cursor:pointer; padding:6px 9px; border-radius:8px; flex-shrink:0}
.hamburger:hover{background:var(--mint-2)}
.mobile-backdrop{display:none; position:fixed; inset:0; background:rgba(6,10,3,.6); z-index:290}
.mobile-backdrop.show{display:block}

.panel{background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; margin-bottom:20px}
.panel .ph{padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px}
.panel .pb{padding:16px 18px}
.kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:20px}
.kpi-link{cursor:pointer; transition:border-color .15s, transform .15s}
.kpi-link:hover,.kpi-link:focus-visible{border-color:var(--leaf); transform:translateY(-1px); outline:none}
.kpi-filtre{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 12px; padding:8px 12px; border:1px solid var(--leaf); border-radius:10px; font-size:13px}
.kpi{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:15px 16px; box-shadow:var(--shadow); position:relative; overflow:hidden}
.kpi::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--leaf)}
.kpi .val{font-size:26px; font-weight:800; letter-spacing:-.5px}
.kpi .lbl{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin-top:2px}

table{width:100%; border-collapse:collapse; font-size:13px}
th{background:var(--forest); color:var(--ink); text-align:left; padding:9px 12px; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; position:sticky; top:0}
td{padding:9px 12px; border-bottom:1px solid var(--line-2)}
tr:hover td{background:var(--mint-2)}
.pill{display:inline-block; padding:2px 10px; border-radius:20px; font-size:11px; font-weight:700}
.pill.ok{background:var(--ok-bg); color:var(--ok)}
.pill.warn{background:var(--warn-bg); color:var(--warn)}
.pill.crit{background:var(--crit-bg); color:var(--crit)}
.pill.na{background:var(--na-bg); color:var(--na)}
.pill.blue{background:var(--blue-bg); color:var(--blue)}

.overlay{position:fixed; inset:0; background:rgba(10,4,9,.68); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px}
.modal{background:var(--card); border-radius:14px; width:100%; max-width:720px; max-height:88vh; overflow:auto; box-shadow:0 24px 60px rgba(0,0,0,.6); animation:pop .18s ease}
.modal.modal-genis{max-width:min(980px, 94vw)}
@keyframes pop{from{opacity:0; transform:scale(.97)} to{opacity:1; transform:none}}
.modal .mh{padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between}
.modal .mb{padding:18px 20px; display:grid; gap:12px}
.modal .mf{padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px}
.grid4{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:12px}
.toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
.toolbar .sp{flex:1}
.hidden{display:none !important}
.muted{color:var(--muted)}
.empty{padding:30px; text-align:center; color:var(--muted); font-size:13px}
.empty-state{padding:48px 24px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px}
.empty-state svg{opacity:.55; margin-bottom:4px}
.empty-state .es-title{font-size:15px; font-weight:600}
.empty-state .es-desc{font-size:13px; color:var(--muted); max-width:360px; line-height:1.5}
.empty-state .es-cta{margin-top:8px}
.note{font-size:12px; color:var(--muted); background:var(--mint-2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:14px}
.x{background:transparent; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:2px 8px; border-radius:6px}
.x:hover{background:var(--mint-2); color:var(--ink)}
.ek-link{color:var(--leaf-d); font-weight:700; cursor:pointer; text-decoration:none; font-size:12.5px}
.ek-link:hover{text-decoration:underline}
.sec-h{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--leaf-d); margin:18px 0 4px; padding-top:14px; border-top:1px solid var(--line-2)}
.sec-h:first-child{margin-top:0; padding-top:0; border-top:none}
.ver-item{display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--line-2)}
.ver-badge{background:var(--mint); color:var(--leaf-d); font-weight:800; font-size:11.5px; padding:3px 9px; border-radius:20px; flex-shrink:0}
.chk-row{display:flex; align-items:center; gap:6px; font-size:12.5px; padding:3px 0}

.rep-inner{background:#fff; color:#1E2A10; border-radius:10px; padding:22px}
.rep-inner table{border-collapse:collapse; width:100%; margin:10px 0}
.rep-inner th,.rep-inner td{border:1px solid #D8E4BB; padding:7px 10px; font-size:12.5px; text-align:left}
.rep-inner th{background:#EEF5DC}
.rep-inner h2{font-size:16px; margin-bottom:4px}
.rep-inner .rep-sub{color:#5D7238; font-size:12px; margin-bottom:16px}
/* 25.09.2026: pencere içindeki alanlar sütunu tam doldursun (spesifikasyon formunda kutular çok küçüktü) */
.modal .mb input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=color]), .modal .mb select, .modal .mb textarea{ width:100%; box-sizing:border-box; }
.modal .mb textarea{ min-height:84px; }
@media print{
  aside.side, .topbar, .mf, .x { display:none !important; }
  .overlay{position:static; background:none; padding:0}
  .modal{box-shadow:none; max-width:none; max-height:none}
  .mh{display:none}
  body{background:#fff}
  /* 25.09.2026: yazdırma görünümünde arkadaki uygulama ekranı basılmasın, yalnız açık pencere */
  body.yazdir-modal > *:not(#overlay){ display:none !important; }
  body.yazdir-modal #overlay{ display:block !important; position:static !important; inset:auto !important; overflow:visible !important; }
  body.yazdir-modal .modal{ width:auto !important; max-width:none !important; max-height:none !important; overflow:visible !important; border:none !important; margin:0 !important; }
  body.yazdir-modal .rep-inner{ padding:0 !important; }
  body.yazdir-modal .mh, body.yazdir-modal .mf{ display:none !important; }
  body.yazdir-modal .modal, body.yazdir-modal .mb{ background:#fff !important; box-shadow:none !important; padding:0 !important; }
  body.yazdir-modal .rep-inner, body.yazdir-modal .rep-inner *{ color:#1E2A10 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}

/* ---------------------------------------------------------------------------
   RESPONSIVE — tablet (≤1024px) ve mobil (≤860px / ≤640px). Sidebar mobilde
   off-canvas'a döner (hamburger ile aç/kapa), grid'ler tek sütuna iner, modal
   tam ekran olur.
--------------------------------------------------------------------------- */
@media (max-width: 1024px){
  .content{padding:18px 20px}
  .grid4{grid-template-columns:1fr 1fr}
}
@media (max-width: 860px){
  aside.side{position:fixed; left:0; top:0; height:100dvh; z-index:300; width:264px;
    transform:translateX(-100%); transition:transform .22s ease; box-shadow:0 0 40px rgba(0,0,0,.5)}
  aside.side.mobile-open{transform:translateX(0)}
  .side.collapsed{width:264px}
  .side.collapsed .logo-txt, .side.collapsed .nav-lbl, .side.collapsed .cnt{display:block}
  .side.collapsed .nav-group-head{display:flex}
  .side.collapsed .nav-group.collapsed .nav-group-body{display:none}
  .side.collapsed .nav-group:not(.collapsed) .nav-group-body{display:flex}
  .hamburger{display:inline-flex; align-items:center; justify-content:center}
  .topbar{padding:12px 16px; gap:10px}
  .topbar h1{font-size:15px}
  .content{padding:16px}
  .kpi-row{grid-template-columns:1fr 1fr}
}
@media (max-width: 640px){
  .grid2, .grid3, .grid4{grid-template-columns:1fr}
  .kpi-row{grid-template-columns:1fr 1fr; gap:10px}
  .kpi{padding:12px 13px}
  .kpi .val{font-size:21px}
  .content{padding:12px}
  .panel .ph{padding:12px 14px; flex-wrap:wrap}
  .panel .pb{padding:12px 14px}
  table{font-size:12px}
  th{padding:8px 9px; font-size:10.5px}
  td{padding:8px 9px}
  .overlay{padding:0; align-items:flex-end}
  .modal{max-width:100%; width:100%; max-height:92dvh; border-radius:16px 16px 0 0; animation:slideUp .2s ease}
  @keyframes slideUp{from{transform:translateY(24px); opacity:0} to{transform:none; opacity:1}}
  .modal .mh{padding:14px 16px}
  .modal .mb{padding:14px 16px}
  .modal .mf{padding:12px 16px; flex-direction:column-reverse; align-items:stretch}
  .modal .mf .btn{width:100%; text-align:center}
  .login-card{padding:22px; max-width:100%}
  .btn{padding:9px 14px}
  input, select, textarea{font-size:14px} /* iOS otomatik yakınlaştırmasını önler */
}
@media (max-width: 400px){
  .kpi-row{grid-template-columns:1fr}
}

#loginScreen{position:fixed; inset:0; background:var(--sand); display:flex; align-items:center; justify-content:center; z-index:500}
.login-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:32px; width:100%; max-width:380px; box-shadow:var(--shadow)}
.login-card .logo-row{justify-content:center; margin-bottom:18px}
.login-err{color:var(--crit); font-size:12.5px; min-height:16px}
/* 24.09.2026: yönetici olmayanlara silme/ayar/geçersiz kılma gösterilmez */
body.qdl-editor [data-urunsil],
body.qdl-editor [data-sertsil],
body.qdl-editor .nav-item[data-v="ayarlar"]{display:none !important}
</style>
<script src="/qdl-hata.js"></script>
<script src="/qdl-takvim.js"></script>
<script src="/qdl-dialog.js"></script>
<script src="/qdl-ceviri.js"></script>
<script src="/qdl-en.js"></script>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="logo-row">
      <svg class="logo-mark" viewBox="-100 -100 200 200" aria-label="Qdataline">
        <circle cx="0" cy="0" r="78" fill="none" stroke="#65A30D" stroke-width="18" stroke-linecap="round" stroke-dasharray="425 65" stroke-dashoffset="-34" transform="rotate(45)"/>
        <path d="M 30 30 L 58 58 L 84 42" fill="none" stroke="#65A30D" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="logo-txt">
        <div class="n">Q<b>data</b>line</div>
        <div class="s" id="loSub">Reçete ve Spesifikasyon Yönetimi</div>
      </div>
    </div>
    <div style="display:grid; gap:10px">
      <div><label id="loEmailLbl">E-posta</label><input id="loEmail" type="email" style="width:100%" autocomplete="username"></div>
      <div><label id="loPassLbl">Şifre</label><input id="loPass" type="password" style="width:100%" autocomplete="current-password"></div>
      <div class="login-err" id="loErr"></div>
      <button class="btn btn-leaf" style="width:100%" data-urs-act="doLogin" id="loBtn">Giriş Yap</button>
      <button class="btn btn-line" style="width:100%" data-urs-act="toggleLang" id="loLangBtn">EN</button>
    </div>
  </div>
</div>

<div class="app hidden" id="appRoot">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo-row brand-toggle" id="brandToggle" title="Menüyü aç/kapat" role="button" tabindex="0">
        <svg class="logo-mark" viewBox="-100 -100 200 200" aria-label="Qdataline">
          <circle cx="0" cy="0" r="78" fill="none" stroke="#65A30D" stroke-width="18" stroke-linecap="round" stroke-dasharray="425 65" stroke-dashoffset="-34" transform="rotate(45)"/>
          <path d="M 30 30 L 58 58 L 84 42" fill="none" stroke="#65A30D" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="logo-txt">
          <div class="n">Q<b>data</b>line</div>
          <div class="s">Reçete ve Spesifikasyon</div>
        </div>
      </div>
    </div>
    <nav class="snav" id="snav"></nav>
    <div style="margin-top:auto; padding:12px 15px; border-top:1px solid var(--line-2); font-size:11.5px; color:var(--muted)">
      <div id="cloudUserLbl" style="margin-bottom:8px"></div>
      <button class="btn btn-line" style="width:100%; margin-bottom:8px" data-urs-act="toggleLang" id="langBtn">EN</button>
      <button class="btn btn-line" style="width:100%; margin-bottom:8px" data-urs-act="toggleTheme" id="themeBtn">🌙 Koyu / ☀ Açık</button>
      <button class="btn btn-line" id="ursTurGosterBtn" data-urs-act="startUrsTour">🧭 Turu göster</button>
      <button class="btn btn-line" style="width:100%" data-urs-act="doLogout">⏻ Çıkış Yap</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="hamburger" id="hamburgerBtn" aria-label="Menü" title="Menü">☰</button>
      <h1 id="pageTitle">Anasayfa</h1>
      <div class="sp"></div>
      <button class="btn btn-leaf hidden" id="btnAdd">+ Yeni</button>
    </div>
    <div class="content" id="content"></div>
  </main>
  <div class="mobile-backdrop" id="mobileBackdrop"></div>
</div>

<div class="overlay hidden" id="overlay"><div class="modal" id="modalBody"></div></div>

<!-- Sorun bildir — kullanıcının bilerek "burada bir şey yanlış" dediği, hata
     fırlatmayan durumlar için. Yalnız giriş yapılmışken görünür. BOY
     pilotundan uyarlandı (bkz. BOY CLAUDE.md, commit 865d0cd/50d6457/7fc5f84). -->
<style>

function qdlCookieAuthStorage(){
  var DOMAIN=/(^|\.)qdataline\.com$/.test(location.hostname)?'.qdataline.com':'';
  var SECURE=location.protocol==='https:'?'; Secure':'';
  var CHUNK=3500;
  function setCookie(name,value,days){
    var attrs='; Path=/; Max-Age='+(days*86400)+'; SameSite=Lax'+SECURE+(DOMAIN?'; Domain='+DOMAIN:'');
    document.cookie=name+'='+encodeURIComponent(value)+attrs;
  }
  function getCookie(name){
    var re=new RegExp('(?:^|; )'+name.replace(/[.$?*|{}()\[\]\\\/+^]/g,'\\$&')+'=([^;]*)');
    var m=document.cookie.match(re);
    return m?decodeURIComponent(m[1]):null;
  }
  function delCookie(name){ document.cookie=name+'=; Path=/; Max-Age=0'+(DOMAIN?'; Domain='+DOMAIN:''); }
  function clearChunks(key){ delCookie(key); for(var i=0;;i++){ if(getCookie(key+'.'+i)==null) break; delCookie(key+'.'+i); } }
  return {
    getItem:function(key){
      var val=getCookie(key);
      if(val==null){ var p0=getCookie(key+'.0'); if(p0!=null){ var parts=[p0],i=1,p; while((p=getCookie(key+'.'+i))!=null){ parts.push(p); i++; } val=parts.join(''); } }
      if(val!=null) return val;
      try{ return localStorage.getItem(key); }catch(e){ return null; }
    },
    setItem:function(key,value){
      try{ localStorage.setItem(key,value); }catch(e){}
      try{
        clearChunks(key);
        if(value.length<=CHUNK){ setCookie(key,value,30); }
        else{ for(var i=0;i*CHUNK<value.length;i++){ setCookie(key+'.'+i,value.slice(i*CHUNK,(i+1)*CHUNK),30); } }
      }catch(e){}
    },
    removeItem:function(key){
      try{ localStorage.removeItem(key); }catch(e){}
      try{ clearChunks(key); }catch(e){}
    }
  };
}

function ursHata(err){
  try{ console.error('[qdl/urs]', err); }catch(e){}
  var msj = String((err && err.message) || '');
  var kod = err && err.code;
  if(/QDL_YALNIZ_ADMIN/.test(msj)) return 'Bu işlem yalnız yönetici tarafından yapılabilir.';
  if(kod === '23505' || /duplicate key/i.test(msj)) return 'Bu kayıt zaten var.';
  if(kod === '23503') return 'İlişkili bir kayıt bulunamadı.';
  if(kod === '23502') return 'Zorunlu bir alan boş bırakıldı.';
  if(kod === '23514') return 'Girilen değer izin verilen aralığın dışında.';
  if(kod === 'PGRST301' || kod === '42501' || /row-level security/i.test(msj)) return 'Bu işlem için yetkiniz yok.';
  if(/Failed to fetch|NetworkError|network/i.test(msj)) return 'Bağlantı hatası. İnternet bağlantınızı kontrol edip tekrar deneyin.';
  return 'Bir hata oluştu. Tekrar deneyin, sürerse yöneticinizle iletişime geçin.';
}

async function tumSatirlar(sorguKur){
  var tum = [], sayfa = 0, ADIM = 1000;
  while(true){
    var q = sorguKur().range(sayfa*ADIM, sayfa*ADIM+ADIM-1);
    var res = await q;
    if(res.error) throw res.error;
    var veri = res.data || [];
    tum = tum.concat(veri);
    if(veri.length < ADIM) break;
    sayfa++;
  }
  return tum;
}

    tumSatirlar(function(){ return sb.from('urun_urunler').select('*').is('deleted_at', null).order('ad'); }),
    tumSatirlar(function(){ return sb.from('urun_receteler').select('*').is('deleted_at', null).order('sira_no'); }),
    tumSatirlar(function(){ return sb.from('urun_spesifikasyonlari').select('*').is('deleted_at', null).order('created_at', {ascending:false}); }),
    tumSatirlar(function(){ return sb.from('urun_spesifikasyon_versiyonlari').select('*').order('created_at', {ascending:false}); }),
    tumSatirlar(function(){ return sb.from('urun_sertifikalari').select('*').is('deleted_at', null).order('gecerlilik_bitis', {ascending:true}); }),
    sb.from('urun_firma_bilgileri').select('*').maybeSingle(),
    tumSatirlar(function(){ return sb.from('urun_arge_projeleri').select('*').is('deleted_at', null).order('created_at', {ascending:false}); }),
    tumSatirlar(function(){ return sb.from('urun_arge_denemeleri').select('*').is('deleted_at', null).order('deneme_no'); }),
    tumSatirlar(function(){ return sb.from('urun_arge_olaylar').select('*').is('deleted_at', null).order('tarih', {ascending:false}); })
  ]);
  state.argeProjeler = _ap; state.argeDenemeler = _ad; state.argeOlaylar = _ao;
  state.urunler = ur; state.receteler = rc; state.specler = sp; state.versiyonlar = vr; state.sertifikalar = st;
  state.firmaBilgisi = fb.data || null;
  navSayaclari();
}

function navSayaclari(){
  var set=function(id,n){ var el=document.getElementById(id); if(el) el.textContent=n; };
  set('cntUrun', (state.urunler||[]).filter(function(u){return u.durum==='Aktif';}).length);
  set('cntSpecTaslak', (state.specler||[]).filter(function(s){return s.durum==='Taslak';}).length);
  set('cntArge', (state.argeProjeler||[]).filter(function(p){return ['Ürüne Dönüştürüldü','İptal'].indexOf(p.asama)<0;}).length);
  set('cntSertBitiyor', (state.sertifikalar||[]).filter(function(s){return sertDurum(s)!=='Geçerli';}).length);
}

};

function ursListe(ad){ var l = ((state.firmaBilgisi||{}).listeler||{})[ad]; return (l && l.length) ? l : URS_LISTE_VARSAYILAN[ad]; }
function ursSecenek(ad, secili, bosEtiket){

async function ursListeKaydet(ad, yeni){
  var fb = state.firmaBilgisi || {}; var ls = Object.assign({}, fb.listeler||{}); ls[ad] = yeni;
  var r = await sb.from('urun_firma_bilgileri').upsert({ tenant_id: cloudTenantId, listeler: ls }, { onConflict: 'tenant_id' });
  if(r.error) throw r.error;
  state.firmaBilgisi = Object.assign({}, fb, { listeler: ls });
}
function ursListeEkle(ad){
  var inp = document.getElementById('lsYeni_'+ad); if(!inp) return; var v = inp.value.trim(); if(!v) return;
  var l = ursListe(ad).slice(); if(l.indexOf(v)<0) l.push(v);
  ursListeKaydet(ad, l).then(function(){ render(); }).catch(function(e){ alert(ursHata(e)); });
}
function ursListeSil(ad, deger){
  var l = ursListe(ad).filter(function(x){ return x!==deger; });
  ursListeKaydet(ad, l).then(function(){ render(); }).catch(function(e){ alert(ursHata(e)); });
}
function ursListelerHtml(ce){
  return Object.keys(URS_LISTE_ADLARI).map(function(ad){
    return '<div style="margin-bottom:14px"><label>'+esc(URS_LISTE_ADLARI[ad])+'</label><div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0">'
      + ursListe(ad).map(function(x){ return '<span class="pill blue" style="display:inline-flex;align-items:center;gap:6px">'+esc(x)+(ce?'<button type="button" class="x" style="font-size:13px;line-height:1" data-urs-act="ursListeSil" data-ad="'+ad+'" data-deger="'+esc(x)+'" title="Kaldır">&times;</button>':'')+'</span>'; }).join('')
      + '</div>'+(ce?'<div style="display:flex;gap:6px;max-width:420px"><input id="lsYeni_'+ad+'" placeholder="Yeni ekle…"><button type="button" class="btn btn-line btn-sm" data-urs-act="ursListeEkle" data-ad="'+ad+'">+ Ekle</button></div>':'')+'</div>';
  }).join('');
}
/* 25.09.2026: spesifikasyon/etiket için içindekiler — reçeteden YALNIZ adlar, oranı büyükten küçüğe;
   bileşik hammadde "Ad (alt1, alt2…)" biçiminde (alt bileşenler de kendi oranına göre sıralı); alerjenli hammadde KALIN+BÜYÜK. */
function icindekilerMetni(urunId){
  return receteOf(urunId).slice().sort(function(a,b){ return (Number(b.oran_yuzde)||0)-(Number(a.oran_yuzde)||0); }).map(function(r){
    var ad = (r.alerjenler||[]).length ? ('<b>'+esc(String(r.hammadde_adi).toLocaleUpperCase('tr-TR'))+'</b>') : esc(r.hammadde_adi);
    var alt = (r.alt_bilesenler||[]).filter(function(x){return x&&x.ad;}).slice().sort(function(a,b){ return (Number(b.oran)||0)-(Number(a.oran)||0); }).map(function(x){ return esc(x.ad); });
    return alt.length ? (ad+' ('+alt.join(', ')+')') : ad;
  }).join(', ');
}
function receteOf(urunId){ return state.receteler.filter(function(r){return r.urun_id===urunId;}).sort(function(a,b){return a.sira_no-b.sira_no;}); }
function specOf(urunId){ return state.specler.find(function(s){return s.urun_id===urunId;}); }
function urunAlerjenleri(urunId){
  var set = {};
  receteOf(urunId).forEach(function(r){ (r.alerjenler||[]).forEach(function(a){ set[a]=true; }); });
  return Object.keys(set);
}
function sertifikaOf(urunId){ return state.sertifikalar.filter(function(s){return s.urun_id===urunId;}); }
function sertDurum(s){
  if(!s.gecerlilik_bitis) return 'Geçerli';
  var bugun = new Date(); bugun.setHours(0,0,0,0);
  var bitis = new Date(s.gecerlilik_bitis);
  var farkGun = Math.round((bitis-bugun)/86400000);
  if(farkGun < 0) return 'Süresi Doldu';
  if(farkGun <= 60) return 'Süresi Yaklaşıyor';
  return 'Geçerli';
}

function showView(v){
  if(!window.__kpiGo) uKpi = null;
  curView = v;
  document.querySelectorAll('.nav-item').forEach(function(el){ el.classList.toggle('on', el.dataset.v===v); });
  document.getElementById('pageTitle').textContent = t(PAGE_TITLES[v] || '');
  var btnAdd = document.getElementById('btnAdd');
  if(v === 'urunler' && canEdit()){ btnAdd.classList.remove('hidden'); btnAdd.textContent = t('+ Yeni Ürün'); btnAdd.onclick = function(){ openUrunForm(); }; }
  else if(v === 'arge' && canEdit()){ btnAdd.classList.remove('hidden'); btnAdd.textContent = t('+ Yeni Ar-Ge Projesi'); btnAdd.onclick = function(){ openArgeProjeForm(); }; }
  else { btnAdd.classList.add('hidden'); }
  render();
}
function render(){
  var c = document.getElementById('content');
  if(curView === 'anasayfa') c.innerHTML = renderAnasayfa();
  else if(curView === 'urunler') c.innerHTML = renderUrunler();
  else if(curView === 'receteler') c.innerHTML = renderReceteler();
  else if(curView === 'spesifikasyonlar') c.innerHTML = renderSpesifikasyonlar();
  else if(curView === 'alerjen') c.innerHTML = renderAlerjenMatrisi();
  else if(curView === 'sertifikalar') c.innerHTML = renderSertifikalar();
  else if(curView === 'arge') c.innerHTML = renderArge();
  else if(curView === 'ayarlar') c.innerHTML = renderAyarlar();
  var _us = uKpiSerit(curView); if(_us) c.insertAdjacentHTML('afterbegin', _us);
  wireView();
}
function wireView(){
  document.querySelectorAll('[data-urunduzenle]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); openUrunForm(b.dataset.urunduzenle); }; });
  document.querySelectorAll('[data-urundetay]').forEach(function(tr){ tr.onclick=function(e){ if(e.target.closest('button,a,input,select')) return; openUrunDetay(tr.dataset.urundetay); }; });
  document.querySelectorAll('[data-urunsil]').forEach(function(b){ b.onclick=function(){ urunSil(b.dataset.urunsil); }; });
  document.querySelectorAll('[data-recetegoster]').forEach(function(b){ b.onclick=function(){ openReceteDetay(b.dataset.recetegoster); }; });
  document.querySelectorAll('[data-specgoster]').forEach(function(b){ b.onclick=function(){ openSpecDetay(b.dataset.specgoster); }; });
  document.querySelectorAll('[data-specyeni]').forEach(function(b){ b.onclick=function(){ openSpecDetay(null, b.dataset.specyeni); }; });
  document.querySelectorAll('[data-sertduzenle]').forEach(function(b){ b.onclick=function(){ openSertForm(b.dataset.sertduzenle); }; });
  document.querySelectorAll('[data-sertsil]').forEach(function(b){ b.onclick=function(){ sertSil(b.dataset.sertsil); }; });
  document.querySelectorAll('[data-sertyeni]').forEach(function(b){ b.onclick=function(){ openSertForm(null, b.dataset.sertyeni); }; });
}

function renderAnasayfa(){
  var aktifUrun = state.urunler.filter(function(u){return u.durum==='Aktif';}).length;
  var receteliUrun = {}; state.receteler.forEach(function(r){ receteliUrun[r.urun_id]=true; });
  var receteSayisi = Object.keys(receteliUrun).length;
  var onayliSpec = state.specler.filter(function(s){return s.durum==='Onaylı';}).length;
  var taslakSpec = state.specler.filter(function(s){return s.durum==='Taslak';}).length;
  var alerjenliUrunSayisi = state.urunler.filter(function(u){ return urunAlerjenleri(u.id).length>0; }).length;
  var sertUyariSayisi = state.sertifikalar.filter(function(s){return sertDurum(s)!=='Geçerli';}).length;
  var sertUyariSatirlar = state.sertifikalar.filter(function(s){return sertDurum(s)!=='Geçerli';})
    .sort(function(a,b){ return (a.gecerlilik_bitis||'').localeCompare(b.gecerlilik_bitis||''); }).slice(0,6);

  var sonReceteliUrunIdler = Object.keys(receteliUrun).sort(function(a,b){
    var ra = state.receteler.filter(function(r){return r.urun_id===a;}).reduce(function(m,r){return r.updated_at>m?r.updated_at:m;},'');
    var rb = state.receteler.filter(function(r){return r.urun_id===b;}).reduce(function(m,r){return r.updated_at>m?r.updated_at:m;},'');
    return rb.localeCompare(ra);
  }).slice(0,8);

  var recSatirlar = sonReceteliUrunIdler.map(function(uid){
    var kalemler = receteOf(uid);
    var alerjenler = urunAlerjenleri(uid);
    return '<tr class="clk" data-recetegoster="'+uid+'" style="cursor:pointer">'
      +'<td><b>'+esc(urunAdi(uid))+'</b></td>'
      +'<td>'+kalemler.length+' hammadde</td>'
      +'<td>'+(alerjenler.length?alerjenler.map(function(a){return '<span class="pill warn" style="margin-right:4px">'+esc(a)+'</span>';}).join(''):'<span class="muted">—</span>')+'</td>'
      +'</tr>';
  }).join('');

  return '<div class="kpi-row">'
    +'<div class="kpi kpi-link" data-ukpi-v="urunler" data-ukpi-f="aktif" data-ukpi-l="Aktif ürünler" role="button" tabindex="0" title="Listeyi aç"><div class="val">'+aktifUrun+'</div><div class="lbl">'+t('Aktif Ürün')+'</div></div>'
    +'<div class="kpi kpi-link" data-ukpi-v="urunler" data-ukpi-f="receteli" data-ukpi-l="Reçetesi olan ürünler" role="button" tabindex="0" title="Listeyi aç"><div class="val">'+receteSayisi+'</div><div class="lbl">'+t('Reçetesi Olan Ürün')+'</div></div>'
    +'<div class="kpi kpi-link" data-ukpi-v="spesifikasyonlar" data-ukpi-f="Onaylı" data-ukpi-l="Onaylı spesifikasyonlar" role="button" tabindex="0" title="Listeyi aç"><div class="val" style="color:var(--ok)">'+onayliSpec+'</div><div class="lbl">'+t('Onaylı Spesifikasyon')+'</div></div>'
    +'<div class="kpi kpi-link" data-ukpi-v="spesifikasyonlar" data-ukpi-f="Taslak" data-ukpi-l="Taslak spesifikasyonlar" role="button" tabindex="0" title="Listeyi aç"><div class="val" style="'+(taslakSpec?'color:var(--warn)':'')+'">'+taslakSpec+'</div><div class="lbl">'+t('Taslak Spesifikasyon')+'</div></div>'
    +'<div class="kpi kpi-link" data-ukpi-v="urunler" data-ukpi-f="alerjenli" data-ukpi-l="Alerjen içeren ürünler" role="button" tabindex="0" title="Listeyi aç"><div class="val" style="'+(alerjenliUrunSayisi?'color:var(--crit)':'')+'">'+alerjenliUrunSayisi+'</div><div class="lbl">'+t('Alerjen İçeren Ürün')+'</div></div>'
    +'<div class="kpi kpi-link" data-ukpi-v="sertifikalar" data-ukpi-f="uyari" data-ukpi-l="Geçerli olmayan / süresi yaklaşan sertifikalar" role="button" tabindex="0" title="Listeyi aç"><div class="val" style="'+(sertUyariSayisi?'color:var(--crit)':'')+'">'+sertUyariSayisi+'</div><div class="lbl">'+t('Sertifika Uyarısı')+'</div></div>'
    +'</div>'
    +(sertUyariSatirlar.length?('<div class="panel"><div class="ph"><h2>⚠ Dikkat Gerektiren Sertifikalar</h2><span class="sp" style="flex:1"></span>'
      +(canEdit()?'<button class="btn btn-line btn-sm" data-urs-act="showView" data-view="sertifikalar">Tüm Sertifikalar →</button>':'')+'</div>'
    +'<div class="pb" style="padding:0"><div class="tbl-wrap" style="overflow-x:auto"><table><thead><tr><th>Ürün</th><th>Tür</th><th>Geçerlilik Bitiş</th><th>Durum</th></tr></thead><tbody>'
    +sertUyariSatirlar.map(function(s){
      var d = sertDurum(s);
      return '<tr class="clk" data-urs-act="showView" data-view="sertifikalar" style="cursor:pointer"><td><b>'+esc(urunAdi(s.urun_id))+'</b></td><td>'+esc(s.sertifika_turu)+'</td>'
        +'<td>'+(s.gecerlilik_bitis?new Date(s.gecerlilik_bitis).toLocaleDateString('tr-TR'):'—')+'</td>'
        +'<td><span class="pill '+(d==='Süresi Doldu'?'crit':'warn')+'">'+esc(d)+'</span></td></tr>';
    }).join('')
    +'</tbody></table></div></div></div>'):'')
    +'<div class="panel"><div class="ph"><h2>Son Güncellenen Reçeteler</h2><span class="sp" style="flex:1"></span>'
      +(canEdit()?'<button class="btn btn-line btn-sm" data-urs-act="showView" data-view="receteler">Tüm Reçeteler →</button>':'')+'</div>'
    +'<div class="pb" style="padding:0"><div class="tbl-wrap" style="overflow-x:auto">'
    +(recSatirlar?'<table><thead><tr><th>Ürün</th><th>Hammadde Sayısı</th><th>Alerjenler</th></tr></thead><tbody>'+recSatirlar+'</tbody></table>'
      :'<div class="empty">Henüz bir ürüne reçete girilmedi. "Ürünler" ekranından bir ürün ekleyip Reçeteler\'den formülasyonunu girebilirsiniz.</div>')
    +'</div></div></div>';
}

var uKpi = null;
function uKpiF(v){ return uKpi && uKpi.v===v ? uKpi.f : ''; }
function uKpiSerit(v){ return uKpiF(v) ? '<div class="kpi-filtre"><b>'+t('Filtre')+':</b> '+esc(uKpi.l)+' <button class="btn btn-line btn-sm" id="uKpiTemizle">✕ '+t('Filtreyi kaldır')+'</button></div>' : ''; }
document.addEventListener('click', function(e){
  if(e.target && e.target.id==='uKpiTemizle'){ uKpi=null; render(); return; }
  var k = e.target.closest && e.target.closest('[data-ukpi-v]'); if(!k) return;
  uKpi = { v:k.dataset.ukpiV, f:k.dataset.ukpiF, l:k.dataset.ukpiL };
  window.__kpiGo=true; try{ showView(uKpi.v); } finally { window.__kpiGo=false; }
});
document.addEventListener('keydown', function(e){
  if((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('kpi-link')){ e.preventDefault(); e.target.click(); }
});
function renderUrunler(){
  var uf = uKpiF('urunler');
  var receteliSet = {}; if(uf==='receteli') state.receteler.forEach(function(r){ receteliSet[r.urun_id]=true; });
  var urunListe = state.urunler.filter(function(u){
    if(uf==='aktif') return u.durum==='Aktif';
    if(uf==='receteli') return !!receteliSet[u.id];
    if(uf==='alerjenli') return urunAlerjenleri(u.id).length>0;
    return true;
  });
  var rows = urunListe.map(function(u){
    var spec = specOf(u.id);
    var recSayisi = receteOf(u.id).length;
    return '<tr class="clk" data-urundetay="'+u.id+'" style="cursor:pointer" title="Ürün detayını aç">'
      +'<td><b>'+esc(u.ad)+'</b></td><td>'+(esc(u.kategori)||'—')+'</td>'
      +'<td>'+(u.durum==='Aktif'?'<span class="pill ok">Aktif</span>':'<span class="pill na">Pasif</span>')+'</td>'
      +'<td>'+recSayisi+' hammadde'+(recSayisi?' <a href="#" class="ek-link" data-recetegoster="'+u.id+'">(görüntüle)</a>':'')+'</td>'
      +'<td>'+(spec?('<span class="pill blue">'+esc(spec.spec_kodu||'')+'</span> '+(spec.durum==='Onaylı'?'<span class="pill ok">Onaylı</span>':'<span class="pill warn">Taslak</span>')+' <a href="#" class="ek-link" data-specgoster="'+spec.id+'">(görüntüle)</a>')
        :'<a href="#" class="ek-link" data-specyeni="'+u.id+'">+ Spesifikasyon Oluştur</a>')+'</td>'
      +'<td style="white-space:nowrap">'+(canEdit()?'<button class="btn btn-line btn-sm" data-urunduzenle="'+u.id+'">✏️</button> <button class="btn btn-danger btn-sm" data-urunsil="'+u.id+'">🗑</button>':'')+'</td>'
      +'</tr>';
  }).join('');
  return '<div class="panel"><div class="pb" style="padding:0"><div class="tbl-wrap" style="overflow-x:auto">'
    +(rows?'<table><thead><tr><th>Ürün</th><th>Kategori</th><th>Durum</th><th>Reçete</th><th>Spesifikasyon</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'
      :emptyState('Henüz ürün eklenmedi', 'İlk ürününüzü ekleyerek reçete ve spesifikasyon yönetimine başlayın.', t('+ Yeni Ürün'), 'openUrunForm'))
    +'</div></div></div>';
}

  openModal('<div class="mh"><b>'+(u?'Ürünü Düzenle':'Yeni Ürün')+'</b><button class="x" data-urs-act="closeModal">&times;</button></div>'

var ARGE_ASAMALAR = ['Fikir','Formülasyon','Deneme Üretimi','Duyusal/Lab','Raf Ömrü','Onay','Ürüne Dönüştürüldü','İptal'];

/* maliyet: reçete satırında birim fiyat (₺/kg) → 1 kg ürün hammadde maliyeti */
function argeMaliyet(r){ var var_=false, m=(r||[]).reduce(function(s,k){ if(k.birim_fiyat!=null&&k.birim_fiyat!==''){ var_=true; return s+(Number(k.oran_yuzde)||0)/100*Number(k.birim_fiyat); } return s; },0); return var_?m:null; }
function argeTL(n){ return n==null?'—':(Number(n).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺/kg'); }
var ARGE_PUAN_ALAN = [['tat','Tat'],['koku','Koku'],['doku','Doku'],['gorunum','Görünüm']];
var ARGE_DOSYALAR = [];
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  var cls = a==='Ürüne Dönüştürüldü'?'ok':(a==='İptal'?'na':(a==='Onay'?'blue':'warn'));

function argeReceteOku(){

function argeToplamGuncelle(){

async function argeDenemeKaydet(projeId, id, no){
  if(kilitliMi()) return;

  var rec = { proje_id:projeId, tarih:val('adTarih')||null, durum:val('adDurum'), recete:recete, parametreler:val('adParam').trim(), sonuc:val('adSonuc').trim(), dosyalar:ARGE_DOSYALAR };
  try{
    var r = id ? await sb.from('urun_arge_denemeleri').update(rec).eq('id',id)
               : await sb.from('urun_arge_denemeleri').insert(Object.assign({kk:'ARD-'+Date.now().toString(36), deneme_no:Number(no)||1}, rec));
    if(r.error) throw r.error;
    var p = argeProje(projeId);
    if(!id && p && (p.asama==='Fikir'||p.asama==='Formülasyon')) await sb.from('urun_arge_projeleri').update({asama:'Deneme Üretimi'}).eq('id',projeId);

async function argeDosyaYukle(projeId){

    for(var i=0;i<files.length;i++){
      var f=files[i], yol=cloudTenantId+'/arge/'+projeId+'/'+Date.now()+'-'+i+'-'+f.name.replace(/[^a-zA-Z0-9.\-_]/g,'_');

async function argeOlayKaydet(projeId, id, tur){
  if(kilitliMi()) return;
  var e=document.getElementById('aoHata'), puanlar={}, hataliPuan=false;
  document.querySelectorAll('.aoPuan').forEach(function(i){ if(i.value!==''){ var n=Number(i.value); if(n<1||n>9) hataliPuan=true; puanlar[i.dataset.k]=n; } });
  if(hataliPuan){ e.textContent=t('Puanlar 1 ile 9 arasında olmalıdır.'); kilitAc(); return; }
  var u = document.getElementById('aoUygun'), g = document.getElementById('aoGun');
  var rec = { proje_id:projeId, tur:tur, tarih:val('aoTarih')||todayISO(), deneme_id:val('aoDeneme')||null, baslik:val('aoBaslik').trim(), detay:val('aoDetay').trim(), puanlar:puanlar,
    raf_gun: g&&g.value!==''?Number(g.value):null, uygun: u&&u.value!==''?u.value==='1':null };
  if(!rec.baslik && !rec.detay && !Object.keys(puanlar).length){ e.textContent=t('Başlık, detay ya da puan girin.'); kilitAc(); return; }
  try{ var r = id ? await sb.from('urun_arge_olaylar').update(rec).eq('id',id) : await sb.from('urun_arge_olaylar').insert(rec);
    if(r.error) throw r.error; await loadAll(); openArgeProje(projeId,'testler'); }catch(x){ e.textContent=ursHata(x); }
  finally{ kilitAc(); }
}

async function aiBesinDegeriUret(urunId){
  var btn = document.getElementById('aiBesinBtn'), msj = document.getElementById('aiBesinMesaj');
  if(btn){ btn.disabled=true; btn.textContent='Hesaplanıyor…'; }
  msj.textContent = '';
  try{

    if(error){ var d = await error.context?.json?.().catch(function(){return null;}); throw new Error((d&&d.hata)||error.message); }
    if(data && data.devre_disi){ msj.textContent = data.mesaj; return; }
    if(data && data.hata){ msj.textContent = data.hata; return; }
    document.getElementById('spEnerji').value = data.enerji_kcal!=null?data.enerji_kcal:'';
    document.getElementById('spYag').value = data.yag_g!=null?data.yag_g:'';
    document.getElementById('spDoymusYag').value = data.doymus_yag_g!=null?data.doymus_yag_g:'';
    document.getElementById('spTransYag').value = data.trans_yag_g!=null?data.trans_yag_g:'';
    document.getElementById('spKarbon').value = data.karbonhidrat_g!=null?data.karbonhidrat_g:'';
    document.getElementById('spSeker').value = data.seker_g!=null?data.seker_g:'';
    document.getElementById('spProtein').value = data.protein_g!=null?data.protein_g:'';
    document.getElementById('spTuz').value = data.tuz_g!=null?data.tuz_g:'';
    msj.innerHTML = '<span style="color:var(--warn)">⚠ Bu değerler AI TAHMİNİDİR, resmi laboratuvar analizinin yerini tutmaz — kaydetmeden önce gözden geçirin.</span>';

async function specOnayEmailGonder(specId){
  var btn = document.getElementById('spOnayEpostaBtn');
  if(!btn || btn.disabled) return;
  btn.disabled = true; var orig = btn.textContent; btn.textContent = 'Gönderiliyor…';
  try{
    var r = await sb.rpc('urun_onay_email_gonder', { p_spec_id: specId });
    if(r.error) throw r.error;
    var d = r.data;
    if(d && d.ok){
      btn.textContent = '✓ Gönderildi: '+d.sent_to;
    } else {
      var neden = (d&&d.reason)||'';
      var msj = neden==='no_recipient' ? 'Önce Ayarlar\'dan "Üst Yönetici E-postası" girin.'
              : neden==='not_draft' ? 'Bu spesifikasyon artık Taslak durumunda değil.'
              : neden==='forbidden' ? 'Bu işlem için yetkiniz yok.'
              : 'Gönderilemedi, lütfen tekrar deneyin.';
      btn.textContent = orig; btn.disabled = false;
      var e = document.getElementById('spHata'); if(e) e.textContent = msj;
    }
  }catch(x){
    btn.textContent = orig; btn.disabled = false;
    var e2 = document.getElementById('spHata'); if(e2) e2.textContent = ursHata(x);
  }
}

async function sertKaydet(sertId, urunId){
  if(kilitliMi()) return;
  var e = document.getElementById('stHata');
  if(!urunId){ e.textContent='Önce bir ürün seçmelisiniz.'; kilitAc(); return; }
  var rec = {
    urun_id:urunId, sertifika_turu:val('stTur'), sertifika_no:val('stNo').trim(), veren_kurum:val('stKurum').trim(),
    gecerlilik_baslangic: val('stBaslangic')||null, gecerlilik_bitis: val('stBitis')||null,
    dosya_url:val('stDosya').trim(), notlar:val('stNot').trim()
  };
  try{
    var r = sertId ? await sb.from('urun_sertifikalari').update(rec).eq('id',sertId)
                   : await sb.from('urun_sertifikalari').insert(Object.assign({kk:'SERT-'+Date.now().toString(36)}, rec));
    if(r.error) throw r.error;
    await loadAll(); closeModal(); render(); buildNav();
  }catch(x){ e.textContent=ursHata(x); }
  finally{ kilitAc(); }
}
async function sertSil(sertId){
  if(!confirm('Bu sertifika kaydı silinsin mi?')) return;
  try{
    var r = await sb.from('urun_sertifikalari').update({deleted_at:new Date().toISOString()}).eq('id',sertId);
    if(r.error) throw r.error;
    await loadAll(); render(); buildNav();
  }catch(x){ alert(ursHata(x)); }
}

var URS_TOUR_DONE_KEY = 'urun.tourDone';
var URS_TOUR_STEPS = [
  { sel:'.side', title:'Menü', text:'Tüm URS ekranları burada: ürünler, reçeteler, spesifikasyonlar, alerjen matrisi, sertifikalar ve Ar-Ge projeleri (yeni ürün denemeleri).', place:'right' },
  { sel:'[data-v="urunler"]', title:'Ürünler', text:'Ürün kataloğunuzu buradan yönetir, her ürünün reçete ve spesifikasyon bağlantısını görürsünüz.', place:'right' },
  { sel:'[data-v="receteler"]', title:'Reçeteler', text:'Ürün reçetelerini bileşen/oran bilgisiyle buradan oluşturur ve güncellersiniz.', place:'right' },
  { sel:'[data-v="spesifikasyonlar"]', title:'Spesifikasyonlar', text:'TGK/BRCGS uyumlu spesifikasyonları buradan hazırlar, onaya gönderir ve versiyonlarsınız.', place:'right' },
  { sel:'[data-v="alerjen"]', title:'Alerjen Matrisi', text:'Ürün bazlı alerjen matrisini buradan takip edersiniz.', place:'right' },
  { sel:'#sorunBildirBtn', title:'Sorun Bildir', text:'Bir hata veya eksiklik fark ederseniz bu düğmeden doğrudan bildirebilirsiniz.', place:'top' }
];
function ursTurGorulduMu(){ try{ return localStorage.getItem(URS_TOUR_DONE_KEY) === '1'; }catch(e){ return true; } }
function ursTurGorulduIsaretle(){ try{ localStorage.setItem(URS_TOUR_DONE_KEY, '1'); }catch(e){} }
function startUrsTour(steps){
  steps = steps || URS_TOUR_STEPS;
  var i = 0;
  var overlay = document.createElement('div');
  overlay.className = 'tour-overlay';
  overlay.innerHTML = '<div class="tour-hole" id="tour-hole"></div>'
    + '<div class="tour-pop" id="tour-pop" role="dialog" aria-modal="true" aria-labelledby="tour-title">'
    + '<div class="tour-title" id="tour-title"></div>'
    + '<div class="tour-text" id="tour-text"></div>'
    + '<div class="tour-foot">'
    + '<button class="btn btn-line" id="tour-skip">Geç</button>'
    + '<span style="flex:1"></span>'
    + '<span class="tour-dots" id="tour-dots"></span>'
    + '<button class="btn btn-line" id="tour-prev">←</button>'
    + '<button class="btn btn-leaf" id="tour-next">İleri</button>'
    + '</div></div>';
  document.body.appendChild(overlay);
  var hole = overlay.querySelector('#tour-hole');
  var pop = overlay.querySelector('#tour-pop');
  function finish(){ ursTurGorulduIsaretle(); overlay.remove(); window.removeEventListener('keydown', onKey); }
  function show(){
    var step = steps[i];
    var el = document.querySelector(step.sel);
    if(!el){ i++; if(i >= steps.length){ finish(); return; } show(); return; }
    el.scrollIntoView({ block:'center', behavior:'smooth' });
    var r = el.getBoundingClientRect(); var pad = 6;
    hole.style.cssText = 'top:'+(r.top-pad)+'px;left:'+(r.left-pad)+'px;width:'+(r.width+pad*2)+'px;height:'+(r.height+pad*2)+'px';
    overlay.querySelector('#tour-title').textContent = step.title;
    overlay.querySelector('#tour-text').textContent = step.text;
    overlay.querySelector('#tour-dots').textContent = (i+1)+' / '+steps.length;
    overlay.querySelector('#tour-prev').disabled = (i === 0);
    overlay.querySelector('#tour-next').textContent = (i === steps.length-1) ? 'Bitir' : 'İleri';
    pop.style.visibility = 'hidden'; pop.style.top = '0'; pop.style.left = '0';
    requestAnimationFrame(function(){
      var pr = pop.getBoundingClientRect(); var top, left;
      if(step.place === 'right'){ left = r.right + 12; top = Math.max(12, r.top); }
      else if(step.place === 'top'){ top = Math.max(12, r.top - pr.height - 12); left = Math.min(r.left, window.innerWidth - pr.width - 12); }
      else { top = r.bottom + 12; left = Math.min(Math.max(12, r.left), window.innerWidth - pr.width - 12); }
      if(top + pr.height > window.innerHeight - 12) top = window.innerHeight - pr.height - 12;
      if(left + pr.width > window.innerWidth - 12) left = window.innerWidth - pr.width - 12;
      pop.style.top = Math.max(12, top)+'px'; pop.style.left = Math.max(12, left)+'px'; pop.style.visibility = 'visible';
    });
  }
  function next(){ if(i < steps.length-1){ i++; show(); } else finish(); }
  function prev(){ if(i > 0){ i--; show(); } }
  function onKey(e){
    if(e.key === 'Escape') finish();
    else if(e.key === 'ArrowRight' || e.key === 'Enter') next();
    else if(e.key === 'ArrowLeft') prev();
  }
  overlay.querySelector('#tour-skip').addEventListener('click', finish);
  overlay.querySelector('#tour-next').addEventListener('click', next);
  overlay.querySelector('#tour-prev').addEventListener('click', prev);
  window.addEventListener('keydown', onKey);
  show();
}
